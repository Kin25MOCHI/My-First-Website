<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Isabela - About</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .about-container {
            width: 100%;
            height: 100vh;
          
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('1isabela.jpg.jpg');
            background-position: center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

       
        .navbar {
            width: 100%;
            height: 80px;
            position: fixed;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 100px; 
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }

        .logo {
            color: #fff;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .menu ul {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 15px; 
        }

        
        .menu ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            transition: 0.3s all ease;
        }

      
        .menu ul li a:hover {
            background: #00d2ff;
            border-color: #00d2ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            transform: translateY(-2px);
        }

        .menu ul li a ion-icon {
            font-size: 18px;
        }

        
        .about-text {
            max-width: 800px;
            color: #fff;
            padding: 20px;
            animation: fadeInUp 1.2s ease;
        }

        .about-text h1 {
            font-size: 80px;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            line-height: 1;
        }

        .about-text h1 span {
            color: #00d2ff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        .about-text p {
            font-size: 20px;
            color: rgba(255,255,255,0.9);
            line-height: 1.8;
            font-weight: 300;
            letter-spacing: 1px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 992px) {
            .navbar { padding: 0 5%; }
            .about-text h1 { font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="main">
        <nav class="navbar">
            <div class="icon">
                <h2 class="logo">ISABELA</h2>
            </div>
            
            <div class="menu">
                <ul>
                    <li><a href="index.html"><ion-icon name="home-outline"></ion-icon> HOME</a></li>
                    <li><a href="#"><ion-icon name="construct-outline"></ion-icon> SERVICE</a></li>
                    <li><a href="#"><ion-icon name="mail-outline"></ion-icon> CONTACT</a></li>
                </ul>
            </div>
        </nav>

        <div class="about-container">
            <div class="about-text">
                <h1>Discover <span>Isabela</span></h1>
                <p>Experience the "Queen Province" of the North. A majestic land where timeless Spanish heritage meets the raw, untamed beauty of the Sierra Madre and the Pacific coast.</p>
            </div>
        </div>
    </div>
</body>
</html>
