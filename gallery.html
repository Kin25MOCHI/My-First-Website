<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isabela Gallery</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), 
                        url('honey.jpg'); 
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        body.fade-in {
            opacity: 1;
        }

        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 1000;
            text-decoration: none;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            transition: 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .back-btn:hover {
            background: #04d9ff;
            color: #000;
            border-color: #04d9ff;
            box-shadow: 0 0 20px rgba(4, 217, 255, 0.6);
            transform: translateX(5px);
        }

        .back-btn ion-icon { font-size: 18px; }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .gallery-wrapper {
            width: 95%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .gallery-title {
            font-size: clamp(1.5rem, 4vh, 3rem); 
            letter-spacing: 12px;
            text-transform: uppercase;
            margin-bottom: 4vh; 
            font-weight: 300;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transform: translateY(-20px);
            animation: slideDown 1s forwards 0.3s;
            opacity: 0;
        }

        @keyframes slideDown {
            to { transform: translateY(0); opacity: 1; }
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            height: 65vh; 
        }

        .photo-card {
            position: relative;
            height: 100%; 
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s ease;
        }

        .photo-label {
            position: absolute;
            bottom: 5%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: clamp(0.8rem, 2vh, 1.2rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            text-shadow: 2px 2px 15px rgba(0,0,0,1);
            z-index: 2;
        }

        .photo-card:hover {
            transform: translateY(-10px);
            border-color: #04d9ff;
            box-shadow: 0 0 30px rgba(4, 217, 255, 0.4);
        }

        .photo-card:hover img {
            transform: scale(1.05);
            filter: brightness(110%);
        }

        @media (max-height: 600px) {
            .gallery-title { margin-bottom: 2vh; }
            .photo-grid { height: 60vh; }
            .back-btn { top: 15px; left: 15px; padding: 8px 15px; }
        }
    </style>
</head>
<body id="page-body">

    <a href="dashboard.html" class="back-btn transition-link">
        <ion-icon name="arrow-back-outline"></ion-icon>
        Dashboard
    </a>

    <div class="gallery-wrapper">
        <h1 class="gallery-title">Isabela Photo Gallery</h1>
        
        <div class="photo-grid">
            <a href="sierra-madre-photos.html" class="photo-card transition-link">
                <img src="sierra-madre.jpg" alt="Sierra Madre">
                <div class="photo-label">Sierra Madre</div>
            </a>

            <a href="honeymoon-island-photos.html" class="photo-card transition-link">
                <img src="honeymoon-island.jpg" alt="Honeymoon Island">
                <div class="photo-label">Honeymoon Island</div>
            </a>

            <a href="magat dam-photo.html" class="photo-card transition-link">
                <img src="magat-dam.jpg" alt="Magat Dam">
                <div class="photo-label">Magat Dam</div>
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');
        });

        document.querySelectorAll('.transition-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                let target = this.href;
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = target;
                }, 500);
            });
        });
    </script>
</body>
</html>
