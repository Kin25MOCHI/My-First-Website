<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('sierra-madre.jpg');
            background-size: cover;
            background-position: center;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 { font-size: 4rem; text-transform: uppercase; margin-bottom: 20px; }
        p { font-size: 1.2rem; line-height: 1.6; color: #ccc; }
        .back-btn {
            margin-top: 30px;
            padding: 10px 30px;
            background: #04d9ff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sierra Madre</h1>
        <p>The Sierra Madre is the longest mountain range in the Philippines. Spanning over 540 kilometers, it serves as a natural shield against typhoons and is home to thousands of species of flora and fauna.</p>
        <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
    </div>
</body>
</html>
